# Сборка Android-версии в облаке GitHub. Ничего не нужно ставить на компьютер.
# Запускается при каждой загрузке файлов в репозиторий и вручную (Actions → Сборка Android → Run workflow).
# Готовый .apk появляется в разделе Releases — его можно скачать прямо с телефона.

name: Сборка Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Установить зависимости
        run: npm install --no-audit --no-fund

      - name: Собрать игру
        run: |
          sed -i 's|<meta name="app-version" content="dev">|<meta name="app-version" content="0.1.${{ github.run_number }}">|' index.html
          grep -q 'content="0.1.${{ github.run_number }}"' index.html
          npm run build

      - name: Создать Android-проект
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Портрет и полный экран
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/ *android:screenOrientation="[a-zA-Z]*"//' "$M"
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity"\n            android:screenOrientation="portrait"/' "$M"
          cp tools/android/MainActivity.java android/app/src/main/java/ru/pogoshooter/game/MainActivity.java

      - name: Иконка и заставка
        continue-on-error: true # если не выйдет — останется стандартная иконка, сборка продолжится
        run: npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#141a3a' --splashBackgroundColor '#141a3a'

      - name: Номер версии
        run: |
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" "$G"
          sed -i "s/versionName \"[^\"]*\"/versionName \"0.1.${{ github.run_number }}\"/" "$G"

      - name: Постоянный тестовый ключ подписи
        # Один и тот же ключ у всех тестовых сборок — новая версия ставится поверх старой, рекорд сохраняется.
        # Это ключ только для тестов. Для Google Play / RuStore нужен свой секретный ключ (см. README).
        run: |
          cp tools/android/pogo-debug.keystore android/app/pogo-debug.keystore
          G=android/app/build.gradle
          sed -i '0,/^android {/s//android {\n    signingConfigs {\n        debug {\n            storeFile file("pogo-debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }/' "$G"
          grep -n -A7 "signingConfigs" "$G"

      - name: Собрать APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../pogoshooter-0.1.${{ github.run_number }}.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../pogoshooter.apk

      - name: Сохранить APK в Actions
        uses: actions/upload-artifact@v4
        with:
          name: pogoshooter-apk
          path: pogoshooter-0.*.apk

      - name: Опубликовать в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pogoshooter 0.1.${{ github.run_number }}
          body: Тестовая сборка для Android. Скачай .apk на телефон и установи.
          files: |
            pogoshooter-0.*.apk
            pogoshooter.apk
          make_latest: true
